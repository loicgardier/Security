name: Exemple cicd
on:
    push:
        branches: [main]
jobs:
    job1:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Bandit
            run: pip install bandit  && bandit -r ./
          - name: Prepare postgres
            env:
                PGPASSWORD: postgres
            run: psql -c 'CREATE DATABASE API' --dbname=postgres --host=localhost --username=postgres -w
          - name: Prepare db
            run: pip install alembic && alembic upgrade head
